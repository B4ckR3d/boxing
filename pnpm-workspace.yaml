# Monorepo workspace (ADR-001, ADR-009).
# Root package tetap berisi aplikasi Next.js selama Phase 1 — belum dipindah ke apps/web.
packages:
  # Root saat ini masih memuat aplikasi Next.js (Phase 1). Ikut didaftarkan agar
  # Turborepo juga menjalankan typecheck/lint/build root dalam satu perintah.
  - "."
  - "apps/*"
  - "packages/*"

# pnpm >=12 memblokir lifecycle script dependency secara default. Daftar ini adalah
# paket yang boleh menjalankan build script (native binary / prisma engines).
allowBuilds:
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
  "@node-rs/argon2": true
  # dependency transitif swagger-ui-express; postinstall-nya hanya telemetri → ditolak
  "@scarf/scarf": false
